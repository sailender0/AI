{% extends "base.html" %}
{% block title %}Analytics — Developer Activity Tracker{% endblock %}
{% block page_subtitle %}Weekly summaries{% endblock %}

{% block content %}
<div class="space-y-5">

  <!-- Header row -->
  <div class="flex items-center justify-between">
    <p class="text-xs text-gray-500">Generated every Friday · click a week to read</p>
    <div class="flex items-center gap-3">
      <span id="gen-status" class="text-xs text-gray-500 hidden"></span>
      <button onclick="generateSummary('weekly')"
        class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Generate This Week
      </button>
    </div>
  </div>

  <!-- Accordion list -->
  <div id="summaries-list">
    <p class="text-sm text-gray-500">Loading…</p>
  </div>

</div>

<style>
  .week-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }
  .week-header:hover { background: var(--surface-2); }
  .week-chevron {
    flex-shrink: 0;
    color: var(--text-3);
    transition: transform 0.2s ease;
  }
  .week-row.open .week-chevron { transform: rotate(180deg); }
  .week-body {
    display: none;
    padding: 16px 18px 18px;
    border-top: 1px solid var(--border);
  }
  .week-row.open .week-body { display: block; }
  .int-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .int-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .int-card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin-bottom: 8px;
  }
  .int-stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-2);
    padding: 2px 0;
  }
  .int-stat-val {
    font-weight: 600;
    color: var(--text-1);
  }
  .bv-btn {
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    border: none;
    outline: none;
  }
  .bv-btn.bv-active {
    background: var(--chrome);
    color: var(--chrome-text);
  }
  .bv-btn:not(.bv-active):hover {
    background: var(--border);
    color: var(--text-1);
  }
  .conn-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-2);
    padding: 3px 12px;
    font-size: 11px;
    font-weight: 500;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
</style>
{% endblock %}

{% block scripts %}
<script src="/static/pages/analytics.js"></script>
{% endblock %}
