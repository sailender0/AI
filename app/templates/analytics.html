{% extends "base.html" %}
{% block title %}Digest — Developer Activity Tracker{% endblock %}
{% block page_subtitle %}Weekly summaries{% endblock %}

{% block content %}
<div class="space-y-5">

  <!-- Header row -->
  <div class="flex items-center justify-between">
    <p class="text-xs text-gray-500">Generated every Friday · click a week to read</p>
    <div class="flex items-center gap-3">
      <span id="gen-status" class="text-xs text-gray-500 hidden"></span>
      <button onclick="generateSummary('weekly')"
        class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Generate This Week
      </button>
    </div>
  </div>

  <!-- Accordion list -->
  <div id="summaries-list">
    <p class="text-sm text-gray-500">Loading…</p>
  </div>

</div>

<style>
  .week-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }
  .week-header:hover { background: var(--surface-2); }
  .week-chevron {
    flex-shrink: 0;
    color: var(--text-3);
    transition: transform 0.2s ease;
  }
  .week-row.open .week-chevron { transform: rotate(180deg); }
  .week-body {
    display: none;
    padding: 16px 18px 18px;
    border-top: 1px solid var(--border);
  }
  .week-row.open .week-body { display: block; }
  .int-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .int-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .int-card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin-bottom: 8px;
  }
  .int-stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-2);
    padding: 2px 0;
  }
  .int-stat-val {
    font-weight: 600;
    color: var(--text-1);
  }
</style>
{% endblock %}

{% block scripts %}
<script>
  async function onBaseReady() {
    await loadSummaries();
  }

  async function loadSummaries() {
    const res      = await fetch('/api/summaries?limit=52', { credentials: 'include' });
    const data     = await res.json();
    const weeklies = (data.summaries || []).filter(s => s.period_type === 'weekly');
    const container = document.getElementById('summaries-list');

    if (!weeklies.length) {
      container.innerHTML = `
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center">
          <p class="text-gray-400 text-sm mb-1">No weekly summaries yet.</p>
          <p class="text-gray-500 text-xs">Click "Generate This Week" above to create your first one.</p>
        </div>`;
      return;
    }

    const statsCache = {};

    container.innerHTML = weeklies.map((s, i) => {
      const startStr = s.period_start ? s.period_start.slice(0, 10) : '';
      const endStr   = s.period_end   ? s.period_end.slice(0, 10)   : '';
      const startLbl = new Date(s.period_start).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const endLbl   = new Date(s.period_end).toLocaleDateString(undefined,   { month: 'short', day: 'numeric', year: 'numeric' });
      return `
        <div class="week-row ${i === 0 ? 'open' : ''}" id="week-${i}"
          data-start="${startStr}" data-end="${endStr}">
          <div class="week-header" onclick="toggleWeek(${i})">
            <div class="flex items-center gap-3">
              <span class="text-xs font-medium px-2 py-0.5 rounded"
                style="background:var(--border-strong);color:var(--text-2)">WEEK</span>
              <span class="text-sm font-semibold" style="color:var(--text-1)">${startLbl} — ${endLbl}</span>
            </div>
            <svg class="week-chevron w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
          <div class="week-body">
            <p class="text-sm leading-relaxed whitespace-pre-wrap" style="color:var(--text-1)">${s.content || '—'}</p>
            <div id="week-stats-${i}" class="int-grid"></div>
          </div>
        </div>`;
    }).join('');

    // Auto-load stats for first (open) week
    if (weeklies.length) loadWeekStats(0, statsCache);

    window._weekStatsCache = statsCache;
  }

  async function loadWeekStats(i, cache) {
    if (cache[i]) return;
    const row   = document.getElementById('week-' + i);
    const start = row?.dataset.start;
    const end   = row?.dataset.end;
    if (!start || !end) return;

    const el = document.getElementById('week-stats-' + i);
    if (!el) return;

    cache[i] = true;
    const res  = await fetch(`/api/week-stats?start=${start}&end=${end}`, { credentials: 'include' });
    const data = await res.json();

    const INTEGRATIONS = [
      {
        key: 'github', label: 'GitHub',
        stats: d => [
          { label: 'Commits',       val: d.commits },
          { label: 'Pull Requests', val: d.pull_requests },
          { label: 'Issues',        val: d.issues },
        ],
      },
      {
        key: 'jira', label: 'Jira',
        stats: d => [
          { label: 'Created',  val: d.created },
          { label: 'Updated',  val: d.updated },
          { label: 'Comments', val: d.comments },
        ],
      },
      {
        key: 'teams', label: 'Teams',
        stats: d => [
          { label: 'Messages', val: d.messages },
        ],
      },
      {
        key: 'gitlab', label: 'GitLab',
        stats: d => [
          { label: 'Commits',        val: d.commits },
          { label: 'Merge Requests', val: d.merge_requests },
          { label: 'Issues',         val: d.issues },
        ],
      },
    ];

    const cards = INTEGRATIONS
      .filter(intg => {
        const d = data[intg.key];
        return d && Object.values(d).some(v => v > 0);
      })
      .map(intg => {
        const rows = intg.stats(data[intg.key])
          .map(r => `<div class="int-stat"><span>${r.label}</span><span class="int-stat-val">${r.val}</span></div>`)
          .join('');
        return `<div class="int-card"><div class="int-card-title">${intg.label}</div>${rows}</div>`;
      })
      .join('');

    el.innerHTML = cards || '<p style="color:var(--text-3);font-size:12px;margin-top:8px">No integration data for this week.</p>';
  }

  function toggleWeek(i) {
    const row = document.getElementById('week-' + i);
    row.classList.toggle('open');
    if (row.classList.contains('open')) {
      loadWeekStats(i, window._weekStatsCache || {});
    }
  }


  async function generateSummary(periodType) {
    const statusEl = document.getElementById('gen-status');
    statusEl.textContent = 'Generating…';
    statusEl.classList.remove('hidden');
    try {
      const res  = await fetch('/api/summaries/generate', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ period_type: periodType }),
      });
      const data = await res.json();
      if (data.ok) {
        statusEl.textContent = 'Done!';
        setTimeout(() => statusEl.classList.add('hidden'), 2000);
        await loadSummaries();
      } else {
        statusEl.textContent = `Error: ${data.error}`;
      }
    } catch {
      statusEl.textContent = 'Failed — check console';
    }
  }
</script>
{% endblock %}
