{% extends "base.html" %}
{% block title %}Email Report — Developer Activity Tracker{% endblock %}
{% block page_subtitle %}Email a report to yourself{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

  <!-- LEFT — Send (pick report + date, preview, send) -->
  <div class="card p-5 space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-semibold" style="color:var(--text-1)">Send a report</h2>
      <span id="email-status" class="text-xs" style="color:var(--text-3)"></span>
    </div>

    <div>
      <label class="text-xs" style="color:var(--text-3)">Report</label>
      <select id="email-kind" onchange="onKindChange()"
        class="w-full text-sm rounded-md px-2 py-1.5 mt-1"
        style="background:var(--surface-2);color:var(--text-1);border:1px solid var(--border)">
        <option value="my_day">My Day</option>
        <option value="device_activity">Device Activity</option>
        <option value="analytics">Analytics</option>
        <option value="standup">Standup</option>
      </select>
      <!-- Device Activity toggle: single day vs weekly per-day breakdown -->
      <div id="device-toggle" class="flex items-center gap-4 mt-2" style="display:none">
        <label class="text-xs flex items-center gap-1" style="color:var(--text-2)">
          <input type="radio" name="device-view" value="device_activity" checked onchange="onKindChange()"> Day
        </label>
        <label class="text-xs flex items-center gap-1" style="color:var(--text-2)">
          <input type="radio" name="device-view" value="device_activity_week" onchange="onKindChange()"> Weekly
        </label>
      </div>
    </div>

    <div>
      <label id="email-date-label" class="text-xs" style="color:var(--text-3)">Date</label>
      <input id="email-date" type="date" onchange="loadPreview()"
        class="w-full text-sm rounded-md px-2 py-1.5 mt-1"
        style="background:var(--surface-2);color:var(--text-1);border:1px solid var(--border)">
      <div id="email-date-hint" class="text-xs mt-1" style="color:var(--text-3)"></div>
    </div>

    <div>
      <label class="text-xs" style="color:var(--text-3)">Preview</label>
      <iframe id="email-preview" sandbox=""
        class="w-full mt-1 rounded-md"
        style="height:320px;border:1px solid var(--border);background:#fff"></iframe>
    </div>

    <button onclick="sendEmail()" id="email-send-btn"
      class="text-sm px-4 py-2 rounded-lg font-medium transition hover:opacity-90"
      style="background:var(--chrome);color:var(--chrome-text)">Send to my email</button>
  </div>

  <!-- RIGHT — Schedule -->
  <div class="card p-5 space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-semibold" style="color:var(--text-1)">Schedule</h2>
      <span id="sched-status" class="text-xs" style="color:var(--text-3)"></span>
    </div>

    <div>
      <label class="text-xs" style="color:var(--text-3)">Report</label>
      <select id="sched-kind" onchange="loadSchedule()"
        class="w-full text-sm rounded-md px-2 py-1.5 mt-1"
        style="background:var(--surface-2);color:var(--text-1);border:1px solid var(--border)">
        <option value="my_day">My Day</option>
        <option value="device_activity">Device Activity (Day)</option>
        <option value="device_activity_week">Device Activity (Week)</option>
        <option value="analytics">Analytics</option>
        <option value="standup">Standup</option>
      </select>
    </div>

    <div>
      <label class="text-xs" style="color:var(--text-3)">Frequency</label>
      <select id="sched-freq"
        class="w-full text-sm rounded-md px-2 py-1.5 mt-1"
        style="background:var(--surface-2);color:var(--text-1);border:1px solid var(--border)">
        <option value="off">Off</option>
        <option value="daily">Daily</option>
        <option value="weekdays">Weekdays</option>
        <option value="weekly">Weekly (Fri)</option>
      </select>
    </div>

    <div>
      <label class="text-xs" style="color:var(--text-3)">Hour (local, 0–23)</label>
      <input id="sched-hour" type="number" min="0" max="23" value="9"
        class="w-full text-sm rounded-md px-2 py-1.5 mt-1"
        style="background:var(--surface-2);color:var(--text-1);border:1px solid var(--border)">
    </div>

    <button onclick="saveSchedule()" id="sched-save-btn"
      class="text-sm px-4 py-2 rounded-lg font-medium transition hover:opacity-90"
      style="background:var(--chrome);color:var(--chrome-text)">Save schedule</button>

    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0">
    <h3 class="text-xs font-semibold" style="color:var(--text-2)">Active schedules</h3>
    <div id="sched-list" class="space-y-1"><p class="text-sm" style="color:var(--text-3)">Loading…</p></div>
  </div>

</div>

<script>
  const KINDS = {
    my_day: 'My Day', device_activity: 'Device Activity (Day)',
    device_activity_week: 'Device Activity (Week)', analytics: 'Analytics', standup: 'Standup'
  };
  const WEEK_KINDS = ['analytics', 'device_activity_week'];

  function localToday() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  function weekLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const dow = (d.getDay() + 6) % 7;                    // Mon=0
    const mon = new Date(d); mon.setDate(d.getDate() - dow);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const fmt = x => x.toLocaleDateString([], { month: 'short', day: 'numeric' });
    return `Week of ${fmt(mon)} – ${fmt(sun)}`;
  }

  // ── Send panel ──────────────────────────────────────────────────────────────
  // Device Activity carries a Day/Weekly toggle → effective kind is device_activity
  // (day) or device_activity_week (weekly). Other reports pass through unchanged.
  function effectiveKind() {
    const kind = document.getElementById('email-kind').value;
    if (kind === 'device_activity') {
      const v = document.querySelector('input[name="device-view"]:checked');
      return v ? v.value : 'device_activity';
    }
    return kind;
  }

  function updateDateUI() {
    const isWeek = WEEK_KINDS.includes(effectiveKind());
    const label = document.getElementById('email-date-label');
    const hint = document.getElementById('email-date-hint');
    const date = document.getElementById('email-date').value;
    if (isWeek) {
      label.textContent = 'Week (pick any day)';
      hint.textContent = date ? weekLabel(date) : '';
    } else {
      label.textContent = 'Date';
      hint.textContent = '';
    }
  }

  function onKindChange() {
    const kind = document.getElementById('email-kind').value;
    document.getElementById('device-toggle').style.display = (kind === 'device_activity') ? 'flex' : 'none';
    updateDateUI();
    loadPreview();
  }

  async function loadPreview() {
    const kind = effectiveKind();
    const date = document.getElementById('email-date').value || null;
    const status = document.getElementById('email-status');
    updateDateUI();
    status.textContent = 'Generating…';
    try {
      const r = await fetch('/api/email/preview', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind, date }),
      });
      const d = await r.json();
      if (d.error) { status.textContent = '✕ ' + d.error; return; }
      document.getElementById('email-preview').srcdoc = d.html || '';
      status.textContent = '';
    } catch (e) { status.textContent = '✕ Error'; }
  }

  async function sendEmail() {
    const kind = effectiveKind();
    const date = document.getElementById('email-date').value || null;
    const btn = document.getElementById('email-send-btn');
    const old = btn.textContent;
    btn.textContent = 'Sending…'; btn.disabled = true;
    try {
      const r = await fetch('/api/email/send', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind, date }),
      });
      const d = await r.json();
      btn.textContent = d.error ? ('✕ ' + d.error) : ('✓ Sent to ' + d.to);
    } catch (e) { btn.textContent = '✕ Error'; }
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 3500);
  }

  // ── Schedule panel ──────────────────────────────────────────────────────────
  async function loadSchedule() {
    const kind = document.getElementById('sched-kind').value;
    try {
      const r = await fetch('/api/email/preferences', { credentials: 'include' });
      const d = await r.json();
      const prefs = d.preferences || [];
      const p = prefs.find(x => x.kind === kind);
      document.getElementById('sched-freq').value = (p && p.enabled) ? p.frequency : 'off';
      if (p) document.getElementById('sched-hour').value = p.hour;
      renderScheduleList(prefs);
    } catch (e) { /* not signed in yet */ }
  }

  function renderScheduleList(prefs) {
    const el = document.getElementById('sched-list');
    const active = (prefs || []).filter(p => p.enabled);
    if (!active.length) { el.innerHTML = '<p class="text-sm" style="color:var(--text-3)">No active schedules.</p>'; return; }
    el.innerHTML = active.map(p =>
      `<div class="text-sm" style="color:var(--text-2)">• ${KINDS[p.kind] || p.kind} — ${p.frequency} at ${String(p.hour).padStart(2, '0')}:00</div>`
    ).join('');
  }

  async function saveSchedule() {
    const kind = document.getElementById('sched-kind').value;
    const frequency = document.getElementById('sched-freq').value;
    const hour = parseInt(document.getElementById('sched-hour').value, 10) || 0;
    const btn = document.getElementById('sched-save-btn');
    const old = btn.textContent;
    btn.textContent = 'Saving…'; btn.disabled = true;
    try {
      const r = await fetch('/api/email/preferences', {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind, frequency, hour }),
      });
      const d = await r.json();
      btn.textContent = d.error ? ('✕ ' + d.error) : '✓ Saved';
      loadSchedule();
    } catch (e) { btn.textContent = '✕ Error'; }
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  }

  // base.html calls this once /api/me resolves (logged-in)
  function onBaseReady() {
    const dateEl = document.getElementById('email-date');
    const today = localToday();
    dateEl.max = today;        // native picker disables future dates
    dateEl.value = today;
    onKindChange();            // sets toggle visibility + loads preview
    loadSchedule();
  }
</script>
{% endblock %}
