{% extends "base.html" %}
{% block title %}My Day — Developer Activity Tracker{% endblock %}
{% block page_subtitle %}Your activity, day by day{% endblock %}

{% block content %}
<div class="space-y-6">

  <div id="due-strip" class="hidden rounded-xl p-4" style="background:#78350f18;border:1px solid #b45309"></div>

  <div onclick="toggleCalendar()" id="week-header"
    class="inline-flex items-center gap-2 rounded-lg px-3 py-2 cursor-pointer transition select-none"
    style="background:var(--surface-2);border:1px solid var(--border)">
    <span id="week-label" class="text-sm font-semibold" style="color:var(--text-1)"></span>
    <svg id="week-chevron" class="w-4 h-4 transition-transform" style="color:var(--text-3)"
      fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
    </svg>
  </div>

  <div class="card p-5" id="cal-card" style="max-width:580px">
    <div class="flex gap-5">

      <div style="flex:1;min-width:0">
        <div class="flex items-center justify-between mb-3">
          <span id="month-label" class="text-sm font-semibold" style="color:var(--text-1)"></span>
          <div class="flex flex-col gap-0.5">
            <button onclick="prevMonth()" id="prev-btn"
              class="w-6 h-6 flex items-center justify-center rounded transition"
              style="color:var(--text-3)" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
              </svg>
            </button>
            <button onclick="nextMonth()" id="next-btn"
              class="w-6 h-6 flex items-center justify-center rounded transition"
              style="color:var(--text-3)" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="grid grid-cols-7 mb-1">
          <div class="cal-hdr">S</div><div class="cal-hdr">M</div><div class="cal-hdr">T</div>
          <div class="cal-hdr">W</div><div class="cal-hdr">T</div><div class="cal-hdr">F</div>
          <div class="cal-hdr">S</div>
        </div>
        <div id="cal-grid"></div>
      </div>

      <div style="width:1px;background:var(--border);flex-shrink:0"></div>

      <div style="width:192px;flex-shrink:0;display:flex;flex-direction:column">
        <div class="flex items-center justify-between mb-3">
          <span id="year-label" class="text-sm font-semibold" style="color:var(--text-1)"></span>
          <div class="flex flex-col gap-0.5">
            <button onclick="prevYear()" id="prev-year-btn"
              class="w-6 h-6 flex items-center justify-center rounded transition"
              style="color:var(--text-3)" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
              </svg>
            </button>
            <button onclick="nextYear()" id="next-year-btn"
              class="w-6 h-6 flex items-center justify-center rounded transition"
              style="color:var(--text-3)" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="month-grid" class="grid grid-cols-3 gap-2" style="flex:1"></div>
        <div class="text-right mt-4">
          <button onclick="goToToday()"
            class="text-xs font-semibold px-3 py-1.5 rounded-lg transition"
            style="background:var(--chrome);color:var(--chrome-text)">Today</button>
        </div>
      </div>

    </div>
  </div>

  <div class="flex items-center gap-3">
    <span id="day-badge"
      class="text-xs px-2 py-0.5 rounded-full font-medium shrink-0"
      style="background:var(--surface-2);color:var(--text-2)"></span>
    <span id="day-label" class="text-sm" style="color:var(--text-2)"></span>
    <div class="ml-auto flex items-center gap-2 shrink-0">
      <button onclick="downloadDailyPdf()" id="dl-btn"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition"
        style="display:none;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Download
      </button>

      <button onclick="generateSummary()" id="gen-btn"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition"
        style="background:var(--chrome);color:var(--chrome-text)">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span id="gen-label">Generate</span>
      </button>
    </div>
  </div>

  <div class="card p-6">
    <h2 class="text-xs font-semibold uppercase tracking-wider mb-3" style="color:var(--text-3)">AI Summary</h2>
    <p id="summary-content" class="text-sm leading-relaxed whitespace-pre-wrap" style="color:var(--text-1)">Loading…</p>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4" id="today-stats"></div>

  <div class="card p-6">
    <h2 class="text-sm font-semibold mb-4" style="color:var(--text-1)">Activity Timeline</h2>
    <div id="events-list" class="space-y-2"></div>
  </div>

</div>

<style>
  .cal-hdr { text-align:center; padding:2px 0; font-size:11px; color:var(--text-3); }

  .cal-row { display:grid; grid-template-columns:repeat(7,1fr); border-radius:8px; border:1.5px solid transparent; }
  .cal-row.this-week { border-color:var(--chrome); }

  .cal-cell {
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    font-size:12px; user-select:none; transition:background 0.12s;
    color:var(--text-1);
  }
  .cal-cell.overflow   { color:var(--text-3); opacity:0.45; cursor:default; }
  .cal-cell.clickable  { cursor:pointer; }
  .cal-cell.clickable:hover { background:var(--surface-2); }
  .cal-cell.future     { color:var(--text-3); opacity:0.35; cursor:default; }
  .cal-cell.today      { background:var(--chrome); color:var(--chrome-text); font-weight:700; }
  .cal-cell.selected:not(.today) {
    background:var(--surface-2); color:var(--text-1); font-weight:600;
    outline:1.5px solid var(--border-strong);
  }

  .month-cell {
    text-align:center; padding:7px 4px; font-size:12px; border-radius:6px;
    color:var(--text-2); cursor:pointer; transition:background 0.12s; user-select:none;
  }
  .month-cell.active   { background:var(--chrome); color:var(--chrome-text); font-weight:600; }
  .month-cell.disabled { color:var(--text-3); opacity:0.35; cursor:default; pointer-events:none; }
  .month-cell:not(.active):not(.disabled):hover { background:var(--surface-2); }
</style>
{% endblock %}

{% block scripts %}
<script src="/static/pages/my_day.js"></script>
{% endblock %}
